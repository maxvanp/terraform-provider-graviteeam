name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 1 * *"

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install govulncheck
        run: 'go install golang.org/x/vuln/cmd/govulncheck@v1.3.0'
      - name: Run govulncheck
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install Gitleaks
        run: 'go install github.com/zricethezav/gitleaks/v8@v8.30.1'
      - name: Scan Git history
        run: '"$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --verbose .'
      - name: Scan working tree
        run: '"$(go env GOPATH)/bin/gitleaks" dir --no-banner --redact --verbose .'
