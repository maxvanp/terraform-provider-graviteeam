name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-check:
    name: Verify Generated Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install tfplugindocs
        run: 'go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0'
      - name: Verify docs
        run: |
          make docs-check TFPLUGINDOCS="$(go env GOPATH)/bin/tfplugindocs"
