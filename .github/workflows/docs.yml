name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-check:
    name: Verify Generated Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
      - name: Install tfplugindocs
        run: 'go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.24.0'
      - name: Verify docs
        run: |
          make docs-check TFPLUGINDOCS="$(go env GOPATH)/bin/tfplugindocs"
