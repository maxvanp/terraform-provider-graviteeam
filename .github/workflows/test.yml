name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
      - name: Install actionlint
        run: 'go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12'
      - name: Lint workflows
        run: $(go env GOPATH)/bin/actionlint .github/workflows/*.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: 'go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4'
      - name: Run lint
        run: make lint GOLANGCI_LINT=$(go env GOPATH)/bin/golangci-lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
      - run: go build -v ./...

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
      - run: go test ./... -v -timeout 10m

  acceptance-test:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [workflow-lint, lint, build, unit-test]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
      - name: Start Gravitee AM
        run: docker compose -f docker-compose.test.yml up -d
      - name: Wait for Gravitee AM
        run: |
          MANAGEMENT_CONTAINER=$(docker compose -f docker-compose.test.yml ps -q am-management-api)
          GATEWAY_CONTAINER=$(docker compose -f docker-compose.test.yml ps -q am-gateway)

          echo "Waiting for Gravitee AM Management API to be healthy..."
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' "$MANAGEMENT_CONTAINER" 2>/dev/null)" = "healthy" ]; then
              echo "Management API is ready"
              break
            fi
            echo "Attempt $i/60..."
            sleep 10
          done

          echo "Waiting for Gravitee AM Gateway to be healthy..."
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' "$GATEWAY_CONTAINER" 2>/dev/null)" = "healthy" ]; then
              echo "Gateway is ready"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 10
          done
          echo "Gravitee AM did not start in time"
          exit 1
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
        run: go test ./... -v -p 1 -timeout 120m
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml ps
          docker compose -f docker-compose.test.yml logs --no-color
      - name: Stop Gravitee AM
        if: always()
        run: docker compose -f docker-compose.test.yml down
