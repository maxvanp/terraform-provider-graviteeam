name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install actionlint
        run: 'go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12'
      - name: Lint workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install golangci-lint
        run: 'go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4'
      - name: Run lint
        run: |
          make lint GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: go build -v ./...

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: go test ./... -v -timeout 10m

  acceptance-test:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [workflow-lint, lint, build, unit-test]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false
      - name: Start Gravitee AM
        run: docker compose -f docker-compose.test.yml up -d
      - name: Wait for Gravitee AM
        run: |
          wait_for_health() {
            local service=$1
            local attempts=$2
            local container status

            container=$(docker compose -f docker-compose.test.yml ps -q "$service")
            if [ -z "$container" ]; then
              echo "No container found for service '$service'"
              docker compose -f docker-compose.test.yml ps
              return 1
            fi

            echo "Waiting for $service to become healthy..."
            for i in $(seq 1 "$attempts"); do
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)
              if [ "$status" = "healthy" ]; then
                echo "$service is ready"
                return 0
              fi
              echo "Attempt $i/$attempts: status=${status:-unknown}"
              sleep 10
            done

            echo "Service '$service' did not become healthy in time"
            docker compose -f docker-compose.test.yml ps
            return 1
          }

          wait_for_health am-management-api 60
          wait_for_health am-gateway 30
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
        run: go test ./... -v -p 1 -timeout 120m
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml ps
          docker compose -f docker-compose.test.yml logs --no-color
      - name: Stop Gravitee AM
        if: always()
        run: docker compose -f docker-compose.test.yml down --remove-orphans
