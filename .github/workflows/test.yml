name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -v ./...

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -v -timeout 10m

  acceptance-test:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [lint, build, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Gravitee AM
        run: docker compose -f docker-compose.test.yml up -d
      - name: Wait for Gravitee AM
        run: |
          echo "Waiting for Gravitee AM Management API (8093)..."
          for i in $(seq 1 60); do
            if curl -so /dev/null -w '%{http_code}' http://localhost:8093/management/organizations/DEFAULT/environments/DEFAULT 2>/dev/null | grep -q '401\|200'; then
              echo "Management API is ready"
              break
            fi
            echo "Attempt $i/60..."
            sleep 10
          done

          echo "Waiting for Gravitee AM Gateway (8092)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8092/_node/health >/dev/null 2>&1; then
              echo "Gateway is ready"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 10
          done
          echo "Gravitee AM did not start in time"
          exit 1
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
        run: go test ./... -v -p 1 -timeout 120m
      - name: Stop Gravitee AM
        if: always()
        run: docker compose -f docker-compose.test.yml down
