name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -v ./...

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -v -timeout 10m

  acceptance-test:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [lint, build, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Gravitee AM
        run: docker compose -f docker-compose.test.yml up -d
      - name: Wait for Gravitee AM
        run: |
          MANAGEMENT_CONTAINER=$(docker compose -f docker-compose.test.yml ps -q am-management-api)
          GATEWAY_CONTAINER=$(docker compose -f docker-compose.test.yml ps -q am-gateway)

          echo "Waiting for Gravitee AM Management API to be healthy..."
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' "$MANAGEMENT_CONTAINER" 2>/dev/null)" = "healthy" ]; then
              echo "Management API is ready"
              break
            fi
            echo "Attempt $i/60..."
            sleep 10
          done

          echo "Waiting for Gravitee AM Gateway to be healthy..."
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' "$GATEWAY_CONTAINER" 2>/dev/null)" = "healthy" ]; then
              echo "Gateway is ready"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 10
          done
          echo "Gravitee AM did not start in time"
          exit 1
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
        run: go test ./... -v -p 1 -timeout 120m
      - name: Stop Gravitee AM
        if: always()
        run: docker compose -f docker-compose.test.yml down
