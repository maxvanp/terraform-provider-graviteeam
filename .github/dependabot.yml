version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # AM 4.13 is tested up to MongoDB 8.2. Stay on the 8.0 LTS line;
      # moving to a newer major or minor is a manual decision.
      - dependency-name: mongo
        versions:
          - ">= 8.1"
