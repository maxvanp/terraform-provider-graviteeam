version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # AM 4.13 is tested on MongoDB 4.4–8.2. Going beyond 8.2 is a
      # manual decision.
      - dependency-name: mongo
        versions:
          - ">= 8.3"
