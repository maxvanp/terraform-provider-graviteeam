version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Gravitee AM 4.13 documents MongoDB 4.4 through 8.2, so 8.3 and later (including 9+) stay ignored
      - dependency-name: mongo
        versions:
          - ">= 8.3"
