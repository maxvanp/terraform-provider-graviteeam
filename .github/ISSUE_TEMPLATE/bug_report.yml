name: Bug Report
description: Report a bug in the Gravitee AM Terraform provider
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in the details below.

  - type: input
    id: provider-version
    attributes:
      label: Provider Version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: terraform-version
    attributes:
      label: Terraform Version
      placeholder: "e.g. 1.9.0"
    validations:
      required: true

  - type: input
    id: gravitee-version
    attributes:
      label: Gravitee AM Version
      placeholder: "e.g. 4.5.0"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Terraform Configuration
      description: The relevant Terraform configuration that causes the issue
      render: hcl
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error messages and logs)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      value: |
        1. `terraform apply`
        2. ...
    validations:
      required: true
