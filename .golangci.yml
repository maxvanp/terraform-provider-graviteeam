version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m

formatters-settings:
  goimports:
    local-prefixes:
      - github.com/maxvanp/terraform-provider-graviteeam
